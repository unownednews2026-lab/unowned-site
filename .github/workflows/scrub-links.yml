# Removes private session links from pull request descriptions as soon as they are opened,
# so no link to a personal account is kept in the project's history.
name: Scrub session links
on:
  pull_request_target:
    types: [opened, reopened]
permissions:
  pull-requests: write
jobs:
  scrub:
    runs-on: ubuntu-latest
    steps:
      - name: Strip session links from the description
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh api "repos/$REPO/pulls/$PR" --jq .body > body.txt || exit 0
          grep -q "claude.ai/code/session" body.txt || exit 0
          python3 - <<'PY'
          import re
          t = open("body.txt").read()
          t = re.sub(r'_?Generated by \[Claude Code\]\(https://claude\.ai/code/session[^)]*\)_?', '', t)
          t = re.sub(r'\[([^\]]*)\]\(https://claude\.ai/code/session[^)]*\)', r'\1', t)
          t = re.sub(r'https://claude\.ai/code/session\S*', '', t)
          t = re.sub(r'(\n\s*---\s*)+$', '', t.rstrip())
          open("body.txt", "w").write(t.rstrip() + "\n")
          PY
          gh api -X PATCH "repos/$REPO/pulls/$PR" -F body=@body.txt > /dev/null
