# News signals: every hour, a free check (Google News headlines, no AI) of which stories have fresh reporting.
# The result goes into the "News signals" issue, which the news desk reads first so it only spends effort where news exists.
name: News signals
on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: signals
  cancel-in-progress: true
jobs:
  signals:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Check headlines
        run: node tools/signals.mjs > /tmp/signals.md && cat /tmp/signals.md
      - name: Update the News signals issue
        run: |
          n=$(gh api "repos/${{ github.repository }}/issues?state=open&per_page=100" --jq '[.[] | select(.title=="News signals")][0].number // empty')
          if [ -z "$n" ]; then gh issue create --title "News signals" --body-file /tmp/signals.md; else gh api -X PATCH "repos/${{ github.repository }}/issues/$n" -F body=@/tmp/signals.md >/dev/null; fi
