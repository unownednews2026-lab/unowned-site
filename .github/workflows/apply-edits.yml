# Applies small edit files (content/edits/*.json) to story pages, so the editor never has to re-send a whole story file.
name: Apply story edits
on:
  push:
    branches: [main]
    paths: ["content/edits/*.json"]
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: apply-edits
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Apply edits
        run: node tools/apply_edits.mjs
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A content/
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -q -m "Editor edits: $(head -c 200 /tmp/edits.log | tr '\n' ' ')"
          for i in 1 2 3; do git fetch -q origin main && git rebase -q origin/main && git push && break; git rebase --abort 2>/dev/null; sleep 10; done
      - name: Log
        if: always()
        run: |
          [ -s /tmp/edits.log ] || exit 0
          { echo "Story edits applied by workflow:"; echo; sed 's/^/- /' /tmp/edits.log; } > /tmp/c.md
          gh issue comment 2 --body-file /tmp/c.md || true
