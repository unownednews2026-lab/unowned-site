# Records the audio for each new daily briefing script and commits the MP3, which then publishes with the site.
name: Briefing audio
on:
  push:
    branches: [main]
    paths: ["content/briefings/*.json", "tools/briefing_audio.py"]
  schedule:
    - cron: "10 7 * * *"   # 07:10 UTC every day (just after Gemini's free daily allowance resets): writes, polishes and records today's script
    - cron: "30 9 * * *"   # 09:30 UTC retry, in case the first run failed or GitHub skipped it (does nothing if today's briefing exists)
    - cron: "0 13 * * *"   # 13:00 UTC: re-record after the editor's morning review, so the audio only uses checked items
  workflow_dispatch:
permissions:
  contents: write
  models: read
concurrency:
  group: briefing-audio
  cancel-in-progress: false
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install voice and audio tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q kokoro-onnx==0.6.1 soundfile pillow fonttools brotli
      - name: Cache voice model
        uses: actions/cache@v4
        with:
          path: model
          key: kokoro-v1.0-int8
      - name: Download voice model
        run: |
          mkdir -p model
          [ -f model/kokoro.onnx ] || curl -sSL -o model/kokoro.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.int8.onnx
          [ -f model/voices.bin ] || curl -sSL -o model/voices.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
      - name: Write today's script if it's missing
        run: node tools/auto_briefing.mjs --refresh
      - name: Record new briefings
        run: python tools/briefing_audio.py model/kokoro.onnx model/voices.bin
      - name: Commit audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A content/briefings/ static/briefings/ || true
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "Briefing: $(ls content/briefings | tail -1 | sed 's/.json//')"
          # If another run pushed a recording meanwhile, keep this run's newer files rather than failing.
          for i in 1 2 3; do git fetch -q origin main && git rebase -q -X theirs origin/main && git push && exit 0; git rebase --abort 2>/dev/null; sleep 10; done
          echo "::warning::Could not push the recording after 3 tries"
