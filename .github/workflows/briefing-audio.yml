# Records the audio for each new daily briefing script and commits the MP3, which then publishes with the site.
name: Briefing audio
on:
  push:
    branches: [main]
    paths: ["content/briefings/*.json"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: briefing-audio
  cancel-in-progress: false
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install voice and audio tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q kokoro-onnx==0.6.1 soundfile pillow
      - name: Cache voice model
        uses: actions/cache@v4
        with:
          path: model
          key: kokoro-v1.0-int8
      - name: Download voice model
        run: |
          mkdir -p model
          [ -f model/kokoro.onnx ] || curl -sSL -o model/kokoro.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.int8.onnx
          [ -f model/voices.bin ] || curl -sSL -o model/voices.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
      - name: Record new briefings
        run: python tools/briefing_audio.py model/kokoro.onnx model/voices.bin
      - name: Commit audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/briefings/ || true
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "Briefing audio: $(ls content/briefings | tail -1 | sed 's/.json//')"
          git pull --rebase -q origin main
          git push
